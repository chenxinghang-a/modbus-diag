name: ci

# 两个 job：
#   host-tests  纯 C 单元测试 + 模拟器自检，几十秒，不需要 ESP-IDF
#   firmware    在 ESP-IDF 官方镜像里从**干净克隆**完整构建一次
#
# firmware 这个 job 的意义：本地 build/ 有缓存，改完编译通过并不能证明
# 「别人 clone 下来能构建」。CI 每次都是全新容器 + 全新 checkout，
# 能抓到「文件没提交」「本机依赖没声明」「Windows 专有写法」这类问题。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译器版本
        run: gcc --version | head -1

      - name: 协议 / UI 编辑 / TCP / 信号 / 报告 / 健康评分 / 流量统计（214 项断言 + 头文件自包含）
        run: bash host_tests/run.sh

      - name: 模拟器自检（45 项断言）
        working-directory: sim
        run: |
          python3 -m pip install --quiet -r requirements.txt
          python3 test_sim.py

      - name: 端到端互通（固件帧层 ↔ pymodbus 模拟器，11 项）
        run: |
          python3 -m pip install --quiet -r sim/requirements.txt
          PY=python3 bash host_tests/run_e2e.sh

      - name: 文档与实测同步（断言数对不上就红）
        run: python3 host_tests/check_docs_sync.py

      - name: 静态一致性（页面注册 / 事件收发 / 行索引，21 项）
        run: python3 host_tests/check_static.py

      - name: 硬件网表自检（固件引脚 ↔ 网表 63 项，含 GPIO 冲突）
        run: python3 hardware/tools/check_hardware.py

      - name: 布局方案自检（48 个元件不重叠 / 不越界 / 接插件靠边）
        run: python3 hardware/tools/gen_placement.py

  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v4

      # 容器里 idf.py 不在非交互 shell 的 PATH 上（实测报 "idf.py: not found"），
      # 每个 step 都要先 source 一次 export.sh。
      - name: 工具链信息
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py --version
          xtensa-esp32s3-elf-gcc --version | head -1

      - name: 构建（sdkconfig 已入库，无需 set-target）
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py build

      - name: 产物信息
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          ls -l build/modbus-diag.bin
          python - <<'PY'
          import os
          size = os.path.getsize("build/modbus-diag.bin")
          print(f"bin = {size} bytes (0x{size:x})")
          # 应用分区 0x1E0000 = 1966080
          free = 1966080 - size
          print(f"分区余量 {free} bytes ({free/1966080*100:.0f}% free)")
          assert size < 1966080, "固件超过应用分区大小"
          PY
