name: host-tests

# 只跑主机侧单元测试：纯 C、无外部依赖，几十秒内出结果。
# 固件构建需要 ESP-IDF 环境（体积大、耗时几分钟），放在本地做，不进 CI。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译器版本
        run: gcc --version | head -1

      - name: 协议层 / 信号处理 / 报告生成（71 项断言）
        run: bash host_tests/run.sh

      - name: 模拟器自检（45 项断言）
        working-directory: sim
        run: |
          python3 -m pip install --quiet -r requirements.txt
          python3 test_sim.py
